apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-platform-orders-deploy
  labels:
    app.kubernetes.io/name: orion-platform
    app.kubernetes.io/component: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-platform
      app.kubernetes.io/component: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-platform
        app.kubernetes.io/component: orders
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: orion-platform-orders
          image: "{{ .Values.orders.image.repository }}:{{ .Values.orders.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orion-platform-config
            - secretRef:
                name: orion-platform-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
